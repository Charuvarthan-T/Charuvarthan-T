<svg width="420" height="80" viewBox="0 0 420 80" xmlns="http://www.w3.org/2000/svg">
  <style>
    .star {
      fill: #d4af37;
      animation: pulse 2.6s ease-in-out infinite;
      transform-origin: center;
    }
    .s2 { animation-delay: 0.2s; }
    .s3 { animation-delay: 0.4s; }
    .s4 { animation-delay: 0.6s; }
    .s5 { animation-delay: 0.8s; }

    @keyframes pulse {
      0%, 100% { opacity: 0.55; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }

    text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 18px;
      fill: #555;
    }
  </style>

  <text x="20" y="30">CodeChef</text>

  <polygon class="star s1" points="40,52 45,65 59,65 48,73 52,87 40,79 28,87 32,73 21,65 35,65"/>
  <polygon class="star s2" points="80,52 85,65 99,65 88,73 92,87 80,79 68,87 72,73 61,65 75,65"/>
  <polygon class="star s3" points="120,52 125,65 139,65 128,73 132,87 120,79 108,87 112,73 101,65 115,65"/>
  <polygon class="star s4" points="160,52 165,65 179,65 168,73 172,87 160,79 148,87 152,73 141,65 155,65"/>
  <polygon class="star s5" points="200,52 205,65 219,65 208,73 212,87 200,79 188,87 192,73 181,65 195,65"/>

  <text x="260" y="68">5★</text>
</svg>
