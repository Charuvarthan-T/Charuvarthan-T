<svg width="440" height="90" viewBox="0 0 440 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- soft golden glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- gold gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffefb0"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#b8962e"/>
    </linearGradient>
  </defs>

  <style>
    .star {
      fill: url(#goldGrad);
      filter: url(#glow);
      animation: wave 3.6s ease-in-out infinite;
      transform-origin: center;
      opacity: 0.75;
    }

    .s1 { animation-delay: 0s; }
    .s2 { animation-delay: 0.15s; }
    .s3 { animation-delay: 0.30s; }
    .s4 { animation-delay: 0.45s; }
    .s5 { animation-delay: 0.60s; }

    @keyframes wave {
      0%, 100% {
        transform: translateY(0) scale(1);
        opacity: 0.7;
      }
      50% {
        transform: translateY(-5px) scale(1.1);
        opacity: 1;
      }
    }

    text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 18px;
      fill: #666;
    }
  </style>

  <!-- Label -->
  <text x="20" y="30">CodeChef</text>

  <!-- Stars (fully inside canvas) -->
  <polygon class="star s1" points="40,55 45,65 56,65 47,72 50,83 40,77 30,83 33,72 24,65 35,65"/>
  <polygon class="star s2" points="90,55 95,65 106,65 97,72 100,83 90,77 80,83 83,72 74,65 85,65"/>
  <polygon class="star s3" points="140,55 145,65 156,65 147,72 150,83 140,77 130,83 133,72 124,65 135,65"/>
  <polygon class="star s4" points="190,55 195,65 206,65 197,72 200,83 190,77 180,83 183,72 174,65 185,65"/>
  <polygon class="star s5" points="240,55 245,65 256,65 247,72 250,83 240,77 230,83 233,72 224,65 235,65"/>

  <!-- Rating -->
  <text x="300" y="75">5★</text>
</svg>
